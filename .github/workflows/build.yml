# Builds HYDRATE for Windows (VST3, Standalone) on every push, after the engine's tests. The zip is under the run's
# "Artifacts"; a tag v* (or a release published on GitHub) also puts it in its release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release && cmake --build build-tests --parallel 4
      - name: run
        run: build-tests/engine_tests

  build:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: build
        shell: bash
        run: cmake --build build --config Release --parallel 4
      - name: pluginval
        # the plugin checked as a host would: loading, its parameters fuzzed, state saved and restored, the editor
        # opened, every buffer size and rate (Tracktion's pluginval, strictness 8)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath pluginval/pluginval.exe -ArgumentList '--strictness-level','8','--timeout-ms','900000','--output-dir','pluginval-log','--validate','"build/Hydrate_artefacts/Release/VST3/HYDRATE.vst3"' -Wait -PassThru -NoNewWindow
          Get-ChildItem pluginval-log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 60 }
          if ($p.ExitCode -ne 0) { throw "pluginval failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-log
          path: pluginval-log
          if-no-files-found: ignore
      - name: package
        shell: pwsh
        run: |
          $a = "build/Hydrate_artefacts/Release"
          $o = "HYDRATE-Windows"
          New-Item -ItemType Directory -Force $o | Out-Null
          Copy-Item -Recurse "$a/VST3/HYDRATE.vst3" $o/
          Copy-Item "$a/Standalone/HYDRATE.exe" $o/
          Copy-Item README.md $o/
          Compress-Archive -Path $o -DestinationPath HYDRATE-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HYDRATE-Windows
          path: HYDRATE-Windows.zip
      - name: release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'release' || github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          files: HYDRATE-Windows.zip
