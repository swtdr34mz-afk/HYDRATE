# Builds HYDRATE for Windows (VST3), the Mac (VST3, AU, Standalone; Apple Silicon and Intel), Linux (VST3, LV2,
# Standalone) and the MPC (mpc/) on every push, after
# the engine's tests. The zip is under the run's
# "Artifacts"; a tag v* (or a release published on GitHub) also puts it in its release.
# Automatic release: when main builds and its version (project(... VERSION x.y.z) in CMakeLists.txt) has no release
# yet, the release vx.y.z is made right here, with the zip and the notes of that version from CHANGES.md.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  # what JUCE needs to build on Linux
  LINUX_DEPS: >-
    libasound2-dev libjack-jackd2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev
    libxcomposite-dev libxrender-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release && cmake --build build-tests --parallel 4
      - name: run
        run: build-tests/engine_tests

  # the MPC plugin (mpc/): Akai's MPC Plugin SDK (pinned) builds it for the MPC's two CPUs and checks it; our own host
  # test plays it as the MPC would (44.1 kHz, its block sizes, programs, its saved state); then the Open MPC catalog's
  # zips (one per CPU) and the SDK's zip, put into the release
  mpc:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the MPC Plugin SDK (pinned)
        run: |
          git init -q mpc-sdk
          git -C mpc-sdk remote add origin https://github.com/inmusic-software/mpc-plugin-builder-sdk
          git -C mpc-sdk fetch -q --depth 1 origin a5949cf6fe2cbfb95bcbe0ddf1f7ef555e71f2be
          git -C mpc-sdk checkout -q FETCH_HEAD
      - name: the version (HYDRATE's)
        run: |
          v=$(sed -n 's/^project(HYDRATE VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"$v\"/" mpc/plugin/plugin.json
          grep '"version"' mpc/plugin/plugin.json
      - name: build (native, arm32, arm64)
        run: python3 mpc/build.py --sdk mpc-sdk --target all
      - name: host test (the native build)
        run: |
          g++ -std=c++17 -O2 -Impc-sdk/framework mpc/test/mpc_host_test.cpp -ldl -o mpc_host_test
          ./mpc_host_test "mpc/build/HYDRATE/build/native/hydrate.so"
      - name: package
        run: |
          cd "mpc/build/HYDRATE/build"
          file "swtdr34mz - VST - HYDRATE/VST/"*.so
          cp "../README.md" "swtdr34mz - VST - HYDRATE/README.md"
          zip -qr "$GITHUB_WORKSPACE/HYDRATE-MPC.zip" "swtdr34mz - VST - HYDRATE"
      - uses: actions/upload-artifact@v4
        with:
          name: HYDRATE-MPC
          path: HYDRATE-MPC.zip
      - name: the Open MPC catalog's tools (pinned)
        run: |
          git init -q openmpc
          git -C openmpc remote add origin https://github.com/open-mpc/mpc-vst-plugins
          git -C openmpc fetch -q --depth 1 origin aa81004516da80490a79b493061723513c438ff6
          git -C openmpc checkout -q FETCH_HEAD
      - name: catalog zips (per CPU) and the SDK zip
        run: |
          v=$(python3 -c "import json; print(json.load(open('mpc/plugin/plugin.json'))['version'])")
          python3 openmpc/tools/sdk_release.py "mpc/build/HYDRATE/build/swtdr34mz - VST - HYDRATE" --version "$v" \
            --id hydrate --repo swtdr34mz-afk/HYDRATE --license MPL-2.0 -o dist
          cp HYDRATE-MPC.zip "dist/HYDRATE-$v-mpc-sdk.zip"
          {
            echo "## Open MPC catalog zips ($v)"
            for z in dist/*-mpc-armv7.zip dist/*-mpc-aarch64.zip; do
              echo; echo "### $(basename "$z")"; echo '```'
              python3 openmpc/tools/catalog_check.py "$z" --catalog --expect-id hydrate --expect-repo swtdr34mz-afk/HYDRATE 2>&1
              echo '```'
            done
            echo; echo "### SHA-256"; echo '```'; (cd dist && sha256sum *.zip); echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for z in dist/*-mpc-armv7.zip dist/*-mpc-aarch64.zip; do
            python3 openmpc/tools/catalog_check.py "$z" --catalog --expect-id hydrate --expect-repo swtdr34mz-afk/HYDRATE > /dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: HYDRATE-catalog
          path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'release' || github.event_name == 'push')
        with:
          files: dist/*.zip
      - name: automatic release (a new version on main)
        # as the build jobs: the first job makes the release, the others add their downloads to it
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(sed -n 's/^project(HYDRATE VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          files=$(ls dist/*.zip 2>/dev/null || true)
          [ -n "$v" ] && [ -n "$files" ] || { echo "nothing to release"; exit 0; }
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            have=$(gh release view "v$v" --json assets -q '.assets[].name' 2>/dev/null || true)
            for f in $files; do
              if echo "$have" | grep -qx "$(basename "$f")"; then echo "$f is in v$v already"; else gh release upload "v$v" "$f"; fi
            done
            exit 0
          fi
          if ! gh release view "v$v" >/dev/null 2>&1; then
            awk -v v="$v" '$0 ~ "^## " { on = ($2 == v) ; next } on' CHANGES.md > notes.md || true
            [ -s notes.md ] || echo "HYDRATE $v" > notes.md
            gh release create "v$v" $files --target "$GITHUB_SHA" --title "HYDRATE $v" --notes-file notes.md && exit 0
            sleep 10
          fi
          tagsha=$(gh api "repos/${{ github.repository }}/commits/v$v" --jq .sha 2>/dev/null || true)
          if [ "$tagsha" != "$GITHUB_SHA" ]; then echo "v$v is out already (from $tagsha)"; exit 0; fi
          gh release upload "v$v" $files --clobber

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-15-intel
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS
      - name: configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: build
        shell: bash
        run: cmake --build build --config Release --parallel 4
      - name: pluginval (Windows)
        # the plugin checked as a host would: loading, its parameters fuzzed, state saved and restored, the editor
        # opened, every buffer size and rate (Tracktion's pluginval, strictness 8)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath pluginval/pluginval.exe -ArgumentList '--strictness-level','8','--timeout-ms','900000','--output-dir','pluginval-log','--validate','"build/Hydrate_artefacts/Release/VST3/HYDRATE.vst3"' -Wait -PassThru -NoNewWindow
          Get-ChildItem pluginval-log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 60 }
          if ($p.ExitCode -ne 0) { throw "pluginval failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: pluginval-log
          path: pluginval-log
          if-no-files-found: ignore
      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $a = "build/Hydrate_artefacts/Release"
          $o = "HYDRATE-Windows"
          New-Item -ItemType Directory -Force $o | Out-Null
          Copy-Item -Recurse "$a/VST3/HYDRATE.vst3" $o/
          Copy-Item README.md $o/
          Compress-Archive -Path $o -DestinationPath HYDRATE-Windows.zip
      - name: pluginval (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --timeout-ms 900000 --validate "build/Hydrate_artefacts/Release/VST3/HYDRATE.vst3"
      - name: auval (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Hydrate_artefacts/Release/AU/HYDRATE.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Hydr Swtd
      - name: package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          a="build/Hydrate_artefacts/Release"
          o=HYDRATE-macOS
          mkdir -p $o
          cp -R "$a/VST3/HYDRATE.vst3" "$a/AU/HYDRATE.component" "$a/Standalone/HYDRATE.app" $o/
          for b in $o/*.vst3 $o/*.component $o/*.app; do codesign --force --deep -s - "$b"; done
          cp README.md $o/
          lipo -info "$o/HYDRATE.vst3/Contents/MacOS/HYDRATE"
          ditto -c -k --sequesterRsrc --keepParent $o $o.zip
          tar -czf $o.tar.gz $o   # (the same as a .tar.gz: some Macs' unzip had lost the plugins' signatures)
      - name: pluginval (Linux)
        # the same check as on Windows, in a virtual screen. Up to three tries: pluginval's own VST3 host (stock JUCE 8
        # code) can crash by itself at the end of its parameter fuzz test (Tracktion/pluginval#177); a plug-in that
        # really fails, fails all three
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q pluginval.zip
          for i in 1 2 3; do
            xvfb-run -a ./pluginval --strictness-level 8 --timeout-ms 600000 --validate "build/Hydrate_artefacts/Release/VST3/HYDRATE.vst3" && exit 0
            echo "::warning::pluginval try $i did not pass"
          done
          exit 1

      - name: package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          a="build/Hydrate_artefacts/Release"
          o=HYDRATE-Linux
          mkdir -p $o
          cp -R "$a/VST3/HYDRATE.vst3" "$a/LV2/HYDRATE.lv2" "$a/Standalone/HYDRATE" $o/
          cp README.md $o/
          tar czf $o.tar.gz $o

      - uses: actions/upload-artifact@v4
        with:
          name: HYDRATE-${{ matrix.name }}
          path: |
            HYDRATE-*.zip
            HYDRATE-*.tar.gz
      - name: release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'release' || github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HYDRATE-*.zip
            HYDRATE-*.tar.gz
      - name: automatic release (a new version on main)
        # the Windows and the Mac job each put their downloads in: the first makes the release, the other adds to it
        # (by hand - Actions -> build -> Run workflow on main: a download the release is missing is added to it)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(sed -n 's/^project(HYDRATE VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$v" ]; then echo "no version found"; exit 0; fi
          files=$(ls HYDRATE-*.zip HYDRATE-*.tar.gz 2>/dev/null || true)   # (Windows: no .tar.gz)
          [ -n "$files" ] || { echo "nothing to release"; exit 0; }
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            have=$(gh release view "v$v" --json assets -q '.assets[].name' 2>/dev/null || true)
            for f in $files; do
              if echo "$have" | grep -qx "$f"; then echo "$f is in v$v already"; else gh release upload "v$v" "$f"; fi
            done
            exit 0
          fi
          if ! gh release view "v$v" >/dev/null 2>&1; then
            awk -v v="$v" '$0 ~ "^## " { on = ($2 == v) ; next } on' CHANGES.md > notes.md || true
            [ -s notes.md ] || echo "HYDRATE $v" > notes.md
            gh release create "v$v" $files --target "$GITHUB_SHA" --title "HYDRATE $v" --notes-file notes.md && exit 0
            sleep 10   # (the other job made it just now)
          fi
          # already there: add this job's downloads - only to the release of this very commit (a later push
          # without a new version leaves the released downloads alone)
          tagsha=$(gh api "repos/${{ github.repository }}/commits/v$v" --jq .sha 2>/dev/null || true)
          if [ "$tagsha" != "$GITHUB_SHA" ]; then echo "v$v is out already (from $tagsha)"; exit 0; fi
          gh release upload "v$v" $files --clobber
